server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: chatsystem

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chat_system}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysqlpw}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:q8vqNqyxISQVeiDi25hsbLK8gV8MHplPs7OSaiRNG5G}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    expiration: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    cookie-name: jwt_token

jwt:
  secret: ${JWT_SECRET:q8vqNqyxISQVeiDi25hsbLK8gV8MHplPs7OSaiRNG5G}
  expiration: ${JWT_EXPIRATION_MS:86400000}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cookie-name: jwt_token


